<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeliCineHD - Ver Películas y Series Online Gratis</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --primary: #00d26a;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 40px;
        }

        /* Header / Navbar */
        header {
            background-color: rgba(13, 17, 23, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .logo span {
            color: var(--primary);
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 16px 8px 36px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Banner de Categorías */
        .categories-bar {
            max-width: 1200px;
            margin: 15px auto;
            padding: 0 16px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .cat-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background-color: var(--primary);
            color: #000;
            font-weight: bold;
            border-color: var(--primary);
        }

        /* Contenido Principal Grid */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin: 20px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        @media (min-width: 768px) {
            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
                gap: 20px;
            }
        }

        /* Card de Película */
        .movie-card {
            background-color: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .poster-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
        }

        .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-quality {
            position: absolute;
            top: 6px;
            left: 6px;
            background-color: var(--primary);
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .badge-lang {
            position: absolute;
            top: 6px;
            right: 6px;
            background-color: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .movie-info {
            padding: 10px;
        }

        .movie-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Modal Reproductor */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-content {
            max-width: 800px;
            margin: 30px auto;
            background-color: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
        }

        .video-container video {
            width: 100%;
            height: 100%;
        }

        .modal-details {
            padding: 20px;
        }

        .modal-title {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .modal-synopsis {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo">PeliCine<span>HD</span></a>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Buscar película o serie..." onkeyup="filterMovies()">
            </div>
        </div>
    </header>

    <div class="categories-bar">
        <button class="cat-btn active">Todas</button>
        <button class="cat-btn">Acción</button>
        <button class="cat-btn">Ciencia Ficción</button>
        <button class="cat-btn">Terror</button>
        <button class="cat-btn">Estrenos 2026</button>
    </div>

    <main>
        <div class="section-title"><i class="fa-solid fa-fire"></i> Cartelera Principal</div>
        <div class="movies-grid" id="moviesGrid"></div>
    </main>

    <!-- Modal para Reproducir -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="video-container">
                <video id="videoPlayer" controls>
                    <source id="videoSource" src="" type="video/mp4">
                    Tu navegador no soporta reproducción de video.
                </video>
            </div>
            <div class="modal-details">
                <h2 class="modal-title" id="mTitle"></h2>
                <div style="font-size: 12px; color: var(--primary);" id="mMeta"></div>
                <p class="modal-synopsis" id="mSynopsis"></p>
            </div>
        </div>
    </div>

    <script>
        // Función para generar portadas SVG Base64 sin depender de servidores externos
        function makePoster(title, c1, c2) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450">
                <defs>
                    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="${c1}"/>
                        <stop offset="100%" stop-color="${c2}"/>
                    </linearGradient>
                </defs>
                <rect width="100%" height="100%" fill="url(#g)"/>
                <circle cx="150" cy="180" r="60" fill="rgba(255,255,255,0.1)"/>
                <text x="50%" y="80%" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">${title}</text>
            </svg>`;
            return 'data:image/svg+xml;base64,' + btoa(svg);
        }

        const sampleVid = 'https://raw.githubusercontent.com/intel-iot-devkit/sample-videos/master/freeview-licence.mp4';

        const moviesData = [
            { id: 1, title: 'Inception', year: '2026', quality: '4K', lang: 'LATINO', poster: makePoster('Inception', '#1a2a6c', '#b21f1f'), video: sampleVid, synopsis: 'Un ladrón que roba secretos corporativos a través del uso de la tecnología de intercambio de sueños.' },
            { id: 2, title: 'Interstellar', year: '2026', quality: 'HD', lang: 'SUB', poster: makePoster('Interstellar', '#0f2027', '#203a43'), video: sampleVid, synopsis: 'Un equipo de exploradores viaja a través de un agujero de gusano en el espacio en un intento por garantizar la supervivencia de la humanidad.' },
            { id: 3, title: 'Blade Runner 2049', year: '2025', quality: '1080p', lang: 'LATINO', poster: makePoster('Blade Runner', '#8A2387', '#E94057'), video: sampleVid, synopsis: 'Un joven blade runner descubre un secreto largo tiempo enterrado que tiene el potencial de sumir lo que queda de la sociedad en el caos.' },
            { id: 4, title: 'The Martian', year: '2025', quality: '4K', lang: 'LATINO', poster: makePoster('The Martian', '#11998e', '#38ef7d'), video: sampleVid, synopsis: 'Un astronauta queda varado en Marte después de que su equipo lo da por muerto, y debe confiar en su ingenio para encontrar una manera de hacer señal a la Tierra.' },
            { id: 5, title: 'Upgrade', year: '2026', quality: 'HD', lang: 'LATINO', poster: makePoster('Upgrade', '#4568DC', '#B06AB3'), video: sampleVid, synopsis: 'En un futuro cercano, la tecnología controla casi todos los aspectos de la vida. Pero cuando la vida de Grey se da la vuelta, su única esperanza de venganza es un implante experimental de chip de computadora.' },
            { id: 6, title: 'Archive', year: '2026', quality: '1080p', lang: 'SUB', poster: makePoster('Archive', '#43C6AC', '#F8FFAE'), video: sampleVid, synopsis: '2038: George Almore está trabajando en una IA equivalente a la humana. Su último prototipo está casi listo, pero su verdadero objetivo es reunirse con su esposa muerta.' }
        ];

        function renderGrid(data) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            data.forEach(item => {
                grid.innerHTML += `
                    <div class="movie-card" onclick="openModal(${item.id})">
                        <div class="poster-wrapper">
                            <span class="badge-quality">${item.quality}</span>
                            <span class="badge-lang">${item.lang}</span>
                            <img src="${item.poster}" alt="${item.title}">
                        </div>
                        <div class="movie-info">
                            <div class="movie-title">${item.title}</div>
                            <div class="movie-meta">
                                <span>${item.year}</span>
                                <span><i class="fa-solid fa-star" style="color:#ffc107;"></i> 8.5</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterMovies() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = moviesData.filter(m => m.title.toLowerCase().includes(query));
            renderGrid(filtered);
        }

        function openModal(id) {
            const item = moviesData.find(m => m.id === id);
            if(!item) return;

            document.getElementById('mTitle').innerText = item.title;
            document.getElementById('mMeta').innerText = `${item.year} • ${item.quality} • ${item.lang}`;
            document.getElementById('mSynopsis').innerText = item.synopsis;
            
            const player = document.getElementById('videoPlayer');
            document.getElementById('videoSource').src = item.video;
            player.load();

            document.getElementById('playerModal').style.display = 'block';
        }

        function closeModal() {
            const player = document.getElementById('videoPlayer');
            player.pause();
            document.getElementById('playerModal').style.display = 'none';
        }

        renderGrid(moviesData);
    </script>
</body>
</html>
