<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeliCineHD - Películas y Series Online</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #0b0f15;
            --bg-header: #131a22;
            --bg-card: #1c242f;
            --accent: #00d26a;
            --text-light: #ffffff;
            --text-gray: #a9b5c2;
            --border: #2a3441;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-light);
            overflow-x: hidden;
        }

        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-light);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .search-container {
            position: relative;
            flex-grow: 1;
            max-width: 350px;
        }

        .search-container input {
            width: 100%;
            background-color: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 10px 15px 10px 40px;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }

        .search-container input:focus {
            border-color: var(--accent);
        }

        .search-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
        }

        .hero {
            position: relative;
            width: 100%;
            height: 450px;
            background-color: #000;
            display: flex;
            align-items: flex-end;
            background-position: center top;
            background-size: cover;
        }

        .hero::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(0deg, var(--bg-body) 0%, rgba(11,15,21,0.5) 50%, rgba(11,15,21,0.1) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
        }

        .hero-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .hero-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 14px;
            color: var(--text-gray);
        }

        .hero-meta span.quality {
            background-color: var(--accent);
            color: #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .hero-synopsis {
            max-width: 600px;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #ddd;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .btn-play-hero {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s;
        }

        .btn-play-hero:hover {
            transform: scale(1.05);
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--accent);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        @media (min-width: 576px) { .grid-layout { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 768px) { .grid-layout { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 992px) { .grid-layout { grid-template-columns: repeat(5, 1fr); } }
        @media (min-width: 1200px) { .grid-layout { grid-template-columns: repeat(6, 1fr); gap: 20px; } }

        .card {
            position: relative;
            background-color: var(--bg-card);
            border-radius: 6px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .card-poster {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            overflow: hidden;
        }

        .card-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:hover .card-poster img {
            transform: scale(1.08);
        }

        .card-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover .card-overlay {
            opacity: 1;
        }

        .play-icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--accent);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 20px;
            padding-left: 4px;
        }

        .badge-top-left {
            position: absolute;
            top: 8px;
            left: 8px;
            background-color: var(--accent);
            color: #000;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 3px;
            z-index: 2;
        }

        .badge-top-right {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 3px;
            z-index: 2;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .card-info {
            padding: 12px 10px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-gray);
        }

        .card-meta .year {
            background-color: #2a3441;
            padding: 2px 5px;
            border-radius: 3px;
        }

        /* Modal modificado para soportar iFrames */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95);
            z-index: 2000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--bg-header);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .btn-close {
