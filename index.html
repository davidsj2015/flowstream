<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeliCineHD - Películas y Series Online</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #0b0f15;
            --bg-header: #131a22;
            --bg-card: #1c242f;
            --accent: #00d26a;
            --text-light: #ffffff;
            --text-gray: #a9b5c2;
            --border: #2a3441;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* Cabecera y Navegación */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-light);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .search-container {
            position: relative;
            flex-grow: 1;
            max-width: 350px;
        }

        .search-container input {
            width: 100%;
            background-color: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 10px 15px 10px 40px;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }

        .search-container input:focus {
            border-color: var(--accent);
        }

        .search-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
        }

        /* Banner Principal (Hero) */
        .hero {
            position: relative;
            width: 100%;
            height: 450px;
            background-color: #000;
            display: flex;
            align-items: flex-end;
            background-position: center top;
            background-size: cover;
        }

        .hero::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(0deg, var(--bg-body) 0%, rgba(11,15,21,0.5) 50%, rgba(11,15,21,0.1) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
        }

        .hero-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .hero-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 14px;
            color: var(--text-gray);
        }

        .hero-meta span.quality {
            background-color: var(--accent);
            color: #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .hero-synopsis {
            max-width: 600px;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #ddd;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .btn-play-hero {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s;
        }

        .btn-play-hero:hover {
            transform: scale(1.05);
        }

        /* Contenedor Principal y Grid */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--accent);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        @media (min-width: 576px) { .grid-layout { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 768px) { .grid-layout { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 992px) { .grid-layout { grid-template-columns: repeat(5, 1fr); } }
        @media (min-width: 1200px) { .grid-layout { grid-template-columns: repeat(6, 1fr); gap: 20px; } }

        /* Tarjeta de Película (Clon Exacto) */
        .card {
            position: relative;
            background-color: var(--bg-card);
            border-radius: 6px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .card-poster {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            overflow: hidden;
        }

        .card-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:hover .card-poster img {
            transform: scale(1.08);
        }

        /* Overlay oscuro y botón play al pasar el mouse */
        .card-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover .card-overlay {
            opacity: 1;
        }

        .play-icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--accent);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 20px;
            padding-left: 4px; /* Centrar visualmente el icono play */
        }

        .badge-top-left {
            position: absolute;
            top: 8px;
            left: 8px;
            background-color: var(--accent);
            color: #000;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 3px;
            z-index: 2;
        }

        .badge-top-right {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 3px;
            z-index: 2;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .card-info {
            padding: 12px 10px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-gray);
        }

        .card-meta .year {
            background-color: #2a3441;
            padding: 2px 5px;
            border-radius: 3px;
        }

        /* Modal / Reproductor */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95);
            z-index: 2000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--bg-header);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .btn-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
        }

        .btn-close:hover {
            background-color: var(--accent);
            color: #000;
        }

        .player-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
        }

        .player-wrapper video {
            width: 100%;
            height: 100%;
            outline: none;
        }

        .modal-info {
            padding: 25px;
        }

        .modal-info h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .modal-info-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 14px;
            color: var(--text-gray);
        }
        
        .modal-info-meta span {
            background-color: var(--bg-card);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .modal-info p {
            font-size: 15px;
            line-height: 1.6;
            color: #ccc;
        }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a href="#" class="logo">PeliCine<span>HD</span></a>
            <div class="nav-links">
                <a href="#">Inicio</a>
                <a href="#">Películas</a>
                <a href="#">Series</a>
                <a href="#">Estrenos</a>
            </div>
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Buscar título, año o género..." onkeyup="handleSearch()">
            </div>
        </div>
    </header>

    <div class="hero" id="heroBanner">
        <div class="hero-content">
            <h1 class="hero-title" id="heroTitle">Cargando...</h1>
            <div class="hero-meta">
                <span class="quality" id="heroQuality">4K</span>
                <span id="heroYear">2026</span>
                <span id="heroType">Película</span>
            </div>
            <p class="hero-synopsis" id="heroSynopsis">...</p>
            <button class="btn-play-hero" onclick="playHero()">
                <i class="fa-solid fa-play"></i> Reproducir Ahora
            </button>
        </div>
    </div>

    <div class="container">
        <!-- Sección de Películas -->
        <div class="section-header">
            <h2 class="section-title"><i class="fa-solid fa-film"></i> Catálogo Completo</h2>
        </div>
        <div class="grid-layout" id="mainGrid">
            <!-- El contenido se inyecta mediante JS -->
        </div>
    </div>

    <!-- Modal del Reproductor -->
    <div class="modal" id="mediaModal">
        <div class="modal-container">
            <button class="btn-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="player-wrapper">
                <video id="videoPlayer" controls playsinline>
                    <source id="videoSource" src="" type="video/mp4">
                </video>
            </div>
            <div class="modal-info">
                <h2 id="modalTitle">Título</h2>
                <div class="modal-info-meta">
                    <span id="modalYear">2026</span>
                    <span id="modalQuality" style="color: var(--accent); border: 1px solid var(--accent);">HD</span>
                    <span id="modalLang">LATINO</span>
                </div>
                <p id="modalSynopsis">Sinopsis completa...</p>
            </div>
        </div>
    </div>

    <script>
        // Sistema de generación de portadas locales (sin enlaces rotos)
        function createCover(title, colorStart, colorEnd, iconPath) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450">
                <defs>
                    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="${colorStart}"/>
                        <stop offset="100%" stop-color="${colorEnd}"/>
                    </linearGradient>
                </defs>
                <rect width="100%" height="100%" fill="url(#grad)"/>
                <circle cx="150" cy="180" r="70" fill="rgba(0,0,0,0.2)"/>
                <path d="${iconPath}" fill="#ffffff" opacity="0.8" transform="translate(125, 155) scale(1.5)"/>
                <text x="50%" y="82%" font-family="sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">${title}</text>
            </svg>`;
            return 'data:image/svg+xml;base64,' + btoa(svg);
        }

        // Iconos vectoriales para los fondos SVG
        const iconSciFi = "M16 13.549l-6.812 3.58 1.3-7.585L4.973 4.17l7.616-1.106L16 -4l3.411 6.924 7.616 1.106-5.515 5.374 1.3 7.585z"; // Estrella
        const iconMovie = "M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-4 12l-6-3.7v7.4L16 16z"; // Cinta

        // Video universal de prueba
        const videoTest = 'https://raw.githubusercontent.com/intel-iot-devkit/sample-videos/master/freeview-licence.mp4';

        // Catálogo optimizado
        const database = [
            { id: 1, type: 'movie', title: 'Interstellar', year: '2014', quality: '4K', lang: 'LATINO', rating: '8.6', synopsis: 'Un grupo de exploradores hace uso de un agujero de gusano recién descubierto para superar las limitaciones de los viajes espaciales tripulados.', poster: createCover('Interstellar', '#0f2027', '#203a43', iconSciFi), bg: '#0f2027', video: videoTest },
            { id: 2, type: 'movie', title: 'The Martian', year: '2015', quality: '1080p', lang: 'LATINO', rating: '8.0', synopsis: 'Durante una misión tripulada a Marte, el astronauta Mark Watney es dado por muerto tras una feroz tormenta y dejado atrás por su tripulación.', poster: createCover('The Martian', '#cb2d3e', '#ef473a', iconSciFi), bg: '#541014', video: videoTest },
            { id: 3, type: 'movie', title: 'Arrival', year: '2016', quality: '4K', lang: 'SUB', rating: '7.9', synopsis: 'Una experta en lingüística es reclutada por el ejército para determinar si los extraterrestres que han llegado a la Tierra vienen en son de paz o suponen una amenaza.', poster: createCover('Arrival', '#2c3e50', '#3498db', iconSciFi), bg: '#182b3a', video: videoTest },
            { id: 4, type: 'movie', title: 'Blade Runner 2049', year: '2017', quality: 'HD', lang: 'LATINO', rating: '8.0', synopsis: 'El descubrimiento de un secreto enterrado hace tiempo por parte de un joven blade runner le lleva a rastrear al antiguo blade runner Rick Deckard.', poster: createCover('Blade Runner', '#8A2387', '#E94057', iconSciFi), bg: '#4a1548', video: videoTest },
            { id: 5, type: 'movie', title: 'Annihilation', year: '2018', quality: '1080p', lang: 'LATINO', rating: '6.8', synopsis: 'Una bióloga se inscribe en una expedición secreta y peligrosa a una zona misteriosa donde las leyes de la naturaleza no se aplican.', poster: createCover('Annihilation', '#11998e', '#38ef7d', iconSciFi), bg: '#0d4f48', video: videoTest },
            { id: 6, type: 'movie', title: 'Upgrade', year: '2018', quality: 'HD', lang: 'SUB', rating: '7.5', synopsis: 'Tras un asalto brutal que lo deja tetrapléjico, Grey Trace recibe un implante experimental que le otorga habilidades físicas sobrehumanas.', poster: createCover('Upgrade', '#4568DC', '#B06AB3', iconSciFi), bg: '#25356e', video: videoTest },
            { id: 7, type: 'movie', title: 'Archive', year: '2020', quality: '1080p', lang: 'LATINO', rating: '6.3', synopsis: 'Un científico trabaja en una inteligencia artificial humana para intentar reunirse con su difunta esposa, a pesar de los riesgos.', poster: createCover('Archive', '#43C6AC', '#F8FFAE', iconSciFi), bg: '#2a7566', video: videoTest },
            { id: 8, type: 'series', title: 'The Walking Dead', year: '2010', quality: 'HD', lang: 'LATINO', rating: '8.1', synopsis: 'El sheriff Rick Grimes despierta de un coma para descubrir que el mundo está en ruinas y debe liderar un grupo de supervivientes para mantenerse con vida.', poster: createCover('TWD', '#3a1c71', '#d76d77', iconMovie), bg: '#1e0f3b', video: videoTest },
            { id: 9, type: 'movie', title: 'Jurassic World', year: '2015', quality: '4K', lang: 'LATINO', rating: '6.9', synopsis: 'Un nuevo parque temático, construido sobre el original Jurassic Park, crea un dinosaurio híbrido modificado genéticamente, el cual escapa.', poster: createCover('Jurassic', '#1f4037', '#99f2c8', iconMovie), bg: '#10211c', video: videoTest },
            { id: 10, type: 'series', title: 'Ancient Aliens', year: '2009', quality: 'HD', lang: 'SUB', rating: '7.1', synopsis: 'Explora la teoría de que los extraterrestres han visitado la Tierra durante millones de años y han ayudado a moldear la historia humana.', poster: createCover('Aliens', '#f12711', '#f5af19', iconMovie), bg: '#6e1106', video: videoTest },
            { id: 11, type: 'series', title: 'Signal', year: '2016', quality: '1080p', lang: 'SUB', rating: '8.5', synopsis: 'Detectives del presente y un detective del pasado se comunican a través de un misterioso walkie-talkie para resolver casos sin resolver.', poster: createCover('Signal', '#000000', '#434343', iconMovie), bg: '#000000', video: videoTest },
            { id: 12, type: 'series', title: 'Vigilante', year: '2023', quality: '4K', lang: 'LATINO', rating: '7.8', synopsis: 'Un estudiante de la academia de policía protege la ley durante el día, pero de noche se convierte en un justiciero sin piedad.', poster: createCover('Vigilante', '#636fa4', '#e8cbc0', iconMovie), bg: '#2f344d', video: videoTest }
        ];

        let currentHeroId = 1;

        function loadInterface() {
            // Configurar Hero Banner (Película Destacada)
            const hero = database[0];
            currentHeroId = hero.id;
            
            // Un pequeño truco visual para el fondo del banner sin usar imágenes pesadas
            document.getElementById('heroBanner').style.background = `linear-gradient(0deg, var(--bg-body) 0%, transparent 100%), linear-gradient(90deg, ${hero.bg} 0%, transparent 100%)`;
            
            document.getElementById('heroTitle').innerText = hero.title;
            document.getElementById('heroQuality').innerText = hero.quality;
            document.getElementById('heroYear').innerText = hero.year;
            document.getElementById('heroType').innerText = hero.type === 'movie' ? 'Película' : 'Serie';
            document.getElementById('heroSynopsis').innerText = hero.synopsis;

            // Renderizar el grid completo
            renderGrid(database);
        }

        function renderGrid(data) {
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '';
            
            if(data.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-gray); padding: 50px;">No se encontraron resultados.</p>';
                return;
            }

            data.forEach(item => {
                grid.innerHTML += `
                    <div class="card" onclick="openPlayer(${item.id})">
                        <div class="card-poster">
                            <span class="badge-top-left">${item.quality}</span>
                            <span class="badge-top-right">${item.lang}</span>
                            <img src="${item.poster}" alt="${item.title}">
                            <div class="card-overlay">
                                <div class="play-icon-circle">
                                    <i class="fa-solid fa-play"></i>
                                </div>
                            </div>
                        </div>
                        <div class="card-info">
                            <div class="card-title">${item.title}</div>
                            <div class="card-meta">
                                <span class="year">${item.year}</span>
                                <span><i class="fa-solid fa-star" style="color:#ffc107; font-size: 10px;"></i> ${item.rating}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = database.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.year.includes(query)
            );
            renderGrid(filtered);
        }

        function playHero() {
            openPlayer(currentHeroId);
        }

        function openPlayer(id) {
            const item = database.find(m => m.id === id);
            if(!item) return;

            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalYear').innerText = item.year;
            document.getElementById('modalQuality').innerText = item.quality;
            document.getElementById('modalLang').innerText = item.lang;
            document.getElementById('modalSynopsis').innerText = item.synopsis;
            
            const player = document.getElementById('videoPlayer');
            document.getElementById('videoSource').src = item.video;
            
            document.getElementById('mediaModal').style.display = 'block';
            document.body.style.overflow = 'hidden'; // Evita que el fondo haga scroll
            
            player.load();
            player.play().catch(e => console.log("Auto-play prevenido por el navegador"));
        }

        function closeModal() {
            const player = document.getElementById('videoPlayer');
            player.pause();
            
            document.getElementById('mediaModal').style.display = 'none';
            document.body.style.overflow = 'auto'; // Restaura el scroll
        }

        // Iniciar
        window.onload = loadInterface;
    </script>
</body>
</html>
